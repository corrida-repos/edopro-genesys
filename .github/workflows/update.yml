name: Update Genesys list
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails (and publishes nothing) if YGOPRODeck and Konami's table disagree.
      - run: python build_lflist.py --out lflists/genesys.lflist.conf
      # GitHub turns off scheduled workflows after 60 days without commits, so record a check monthly.
      - name: Keep the schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u +%Y-%m-%d > last-checked.txt
          fi
      - name: Commit if changed
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet -- lflists; then msg="Genesys points unchanged (monthly check)"; else msg="Update Genesys points"; fi
          git commit -m "$msg"
          git push
